name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Guard against stray Markdown fences in HTML
        run: |
          if grep -R --include='*.html' -n '```' public; then
            echo "Stray Markdown code fences found in HTML" >&2
            exit 1
          fi
      # `npm run validate` previously ran only from `npm run deploy`, so a PR
      # could break a canonical, a title or an internal link and CI stayed green.
      - name: Validate site SEO invariants, links and sitemap
        run: npm run validate

      - name: Unit-test the HTTPS-redirect Worker
        run: npm test

      - name: Validate Wrangler config
        run: npx wrangler deploy --dry-run --outdir /tmp/wrangler-dist
